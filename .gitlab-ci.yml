stages:
  - check
  - sim
  - backend

# The group5-runner host is a small 2 vCPU / 1 GB Azure VM. Two heavy sim
# containers (Verilator build + cocotb) running concurrently exhaust its RAM
# and wedge the box, so every job is interruptible and the sim jobs are
# serialized via a shared resource_group with a hard timeout.
default:
  interruptible: true

variables:
  # Prebuilt CI images live locally on the group5-runner host (the LRZ GitLab
  # instance has no Container Registry). They are built on the runner with:
  #   docker build -f ci/check.Dockerfile -t group5-ci-check:latest .
  #   docker build -f ci/sim.Dockerfile   -t group5-ci-sim:latest   .
  # and consumed here via the runner's `pull_policy = ["if-not-present"]`, so
  # the check/sim jobs run with no per-pipeline apt/pip install. Rebuild the
  # images on the runner when ci/*.Dockerfile or requirements/* change.
  CHECK_IMAGE: "group5-ci-check:latest"
  SIM_IMAGE: "group5-ci-sim:latest"
  # Full-SoC sim image: SIM_IMAGE + colorama + prebaked Didactic-SoC bender
  # checkouts / vendored IPs. Built on the runner with:
  #   docker build -f ci/soc.Dockerfile -t group5-ci-soc:latest .
  SOC_IMAGE: "group5-ci-soc:latest"
  # Eikon backend jobs (ssh/rsync client). Plain alpine installs the tools on
  # every run; after building the image on the runner with
  #   docker build -f ci/eikon.Dockerfile -t group5-ci-eikon:latest .
  # set this to group5-ci-eikon:latest (here or as a CI/CD variable).
  EIKON_IMAGE: "alpine:3.19"

# ccache for the Verilator-based jobs: Verilator's generated makefiles use
# $OBJCACHE, so unchanged generated C++ is not recompiled. The cache dir lives
# in the project dir (GitLab cache paths must) and is kept per job on the runner.
# ccache is baked into SIM_IMAGE (ci/sim.Dockerfile); jobs print `ccache -s`.
.ccache:
  variables:
    CCACHE_DIR: "$CI_PROJECT_DIR/.ccache"
    CCACHE_BASEDIR: "$CI_PROJECT_DIR"
    CCACHE_MAXSIZE: "500M"
  cache:
    key: ccache-$CI_JOB_NAME
    paths:
      - .ccache/
  before_script:
    # Only enable it when the image has ccache (an old image falls back to a plain build).
    - if command -v ccache >/dev/null 2>&1; then export OBJCACHE=ccache; else echo "ccache not installed, building without"; fi
  after_script:
    - ccache -s || true

# ---------------------------------------------------------------------------
# Check stage: tooling (ruff, pre_commit) is baked into CHECK_IMAGE.
# ---------------------------------------------------------------------------
check_conventions:
  stage: check
  image: $CHECK_IMAGE
  script:
    - python3 scripts/check_conventions.py

check_python_format:
  stage: check
  image: $CHECK_IMAGE
  script:
    - ruff format --check .

check_gitkeep:
  stage: check
  image: $CHECK_IMAGE
  script:
    - python3 scripts/check_gitkeep.py

check_docs:
  stage: check
  image: $CHECK_IMAGE
  script:
    - python3 scripts/check_docs.py

# ---------------------------------------------------------------------------
# Sim stage: Verilator + Python sim deps are baked into SIM_IMAGE.
# ---------------------------------------------------------------------------
cocotb_sim:
  extends: .ccache
  stage: sim
  image: $SIM_IMAGE
  resource_group: sim-runner
  timeout: 5m
  script:
    - pytest -vv sim/test_runner.py

accel_verilator_sim:
  extends: .ccache
  stage: sim
  image: $SIM_IMAGE
  resource_group: sim-runner
  timeout: 5m
  script:
    - ./sim/scripts/run_verilator.sh

# One job for all three formal proofs: they take ~20 s in total, so a job each
# only paid for three serialized container startups on the small runner.
formal:
  stage: sim
  image: $SIM_IMAGE
  resource_group: sim-runner
  timeout: 15m
  script:
    - |
      for d in control_unit mac_pe systolic_array; do
        (cd formal/$d && sby -f $d.sby && sby -f ${d}_cover.sby)
      done

# pyuvm end-to-end test for accelerator_top: loads matrices A/B, triggers
# compute, drains C, compares against a Python golden model.  Runs on the
# same SIM_IMAGE (which includes pyuvm via requirements/sim.txt).
accel_uvm_sim:
  extends: .ccache
  stage: sim
  image: $SIM_IMAGE
  resource_group: sim-runner
  timeout: 8m
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: &uvm_paths
        - rtl/**/*
        - sim/testbenches/accel_uvm/**/*
        - sim/testbenches/common/**/*
        - requirements/sim.txt
        - .gitlab-ci.yml
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes: *uvm_paths
  script:
    - cd sim/testbenches/accel_uvm && make

# ---------------------------------------------------------------------------
# Full-SoC, bus-driven functional test: the Ibex core executes sw/accel/accel.c
# and drives the accelerator through the real OBI/APB fabric (PASS when
# accel_result == 0xACCE5500). This verilates the ENTIRE SoC (Ibex + fabric +
# accelerator), which is heavy, so it is guarded:
#   * runs only when accelerator RTL / the SoC integration changes,
#   * serialized via the shared sim-runner resource_group,
#   * single-threaded + output-split build (VERILATOR_JOBS=1) to bound peak RAM
#     on the ~900 MB group5-runner host (a swapfile on the host absorbs the
#     remaining headroom),
#   * generous timeout because the constrained, swap-backed build is slow.
# Needs the Didactic-SoC submodule checked out (non-recursive: its nested
# Subsystem_* submodules use SSH and are not required for this build). The
# bender/vendored dependencies are prebaked into SOC_IMAGE at /opt/soc-deps.
# ---------------------------------------------------------------------------
accel_soc_sim:
  extends: .ccache
  stage: sim
  image: $SOC_IMAGE
  resource_group: sim-runner
  timeout: 30m
  variables:
    GIT_SUBMODULE_STRATEGY: normal
    GIT_SUBMODULE_DEPTH: 1
    VERILATOR_JOBS: "1"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: &soc_paths
        - rtl/**/*
        - Didactic-SoC
        - ci/soc.Dockerfile
        - .gitlab-ci.yml
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes: *soc_paths
  script:
    # Restore the prebaked SoC dependencies into the freshly checked-out
    # submodule working tree (both paths are gitignored, so absent after clone).
    - cp -a /opt/soc-deps/.bender Didactic-SoC/.bender
    - cp -a /opt/soc-deps/vendor_ips Didactic-SoC/vendor_ips
    - cd Didactic-SoC && python3 ./verification/verilator/verilate_soc_accel.py


# ---------------------------------------------------------------------------
# CPU vs. Accelerator GEMM benchmark — wall-clock speedup report.
#
# Runs the 16×16 INT8 configuration (full hardware utilisation) using the
# prebuilt verification/verilator/benchmark.hex.  Produces a GitLab Metrics
# artifact (benchmark_metrics.txt in Prometheus key-value format) that is
# displayed under Pipeline → Metrics and tracked across commits.
#
# Rebuild the hex locally when firmware changes:
#   make -C Didactic-SoC verilate_benchmark_16
#
# Same trigger paths and infrastructure requirements as accel_soc_sim.
# ---------------------------------------------------------------------------
benchmark_sim:
  extends: .ccache
  stage: sim
  image: $SOC_IMAGE
  resource_group: sim-runner
  timeout: 20m
  variables:
    GIT_SUBMODULE_STRATEGY: normal
    GIT_SUBMODULE_DEPTH: 1
    VERILATOR_JOBS: "1"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: &benchmark_paths
        - rtl/**/*
        - Didactic-SoC
        - ci/soc.Dockerfile
        - .gitlab-ci.yml
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes: *benchmark_paths
  script:
    - cp -a /opt/soc-deps/.bender Didactic-SoC/.bender
    - cp -a /opt/soc-deps/vendor_ips Didactic-SoC/vendor_ips
    - cd Didactic-SoC
    - python3 ./verification/verilator/verilate_soc_benchmark.py 2>&1 | tee /tmp/bench_out.txt
    - python3 ../scripts/parse_benchmark_metrics.py /tmp/bench_out.txt benchmark_metrics.txt
  artifacts:
    when: always
    reports:
      metrics: Didactic-SoC/benchmark_metrics.txt
    paths:
      - Didactic-SoC/benchmark_metrics.txt
    expire_in: 4 weeks

# ---------------------------------------------------------------------------
# Backend stages: ASIC physical flow (Fusion Compiler, ~45 min) on the TUM
# Eikon lab machine. The licenses/modules only exist there, so these jobs are
# just SSH clients: the group5-runner host (Azure VM) rsyncs the checkout to
# an Eikon lab host (the least loaded usable one, picked by asic_synth) and runs
# asic/scripts/run_flow.sh over SSH.
# The jobs of one pipeline share /tmp/ge63nag_ci/<project>-<pipeline> on Eikon
# (one Fusion Compiler library). They sit in one `backend` stage and run in
# order through `needs`, so each can be retried on its own; a
# failed pipeline leaves that directory for the retry. Each job returns
# asic/reports/ as artifacts; asic_cleanup removes the remote directory.
#
# One-time setup (see docs/guides/asic_backend_guide.md, "CI on Eikon"):
#   * the runner host holds a dedicated key in /home/li/.ssh/eikon_ci and the
#     runners mount it read-only at /eikon-ssh (volumes in config.toml),
#   * the public key is in ge63nag@<host> ~/.ssh/authorized_keys on every pool host.
# Runs automatically on the default branch when ASIC/RTL files change. On merge
# requests only asic_synth is manual (it occupies a shared lab machine and
# licenses); the later jobs follow it through `needs`.
# ---------------------------------------------------------------------------
.asic_backend:
  image: $EIKON_IMAGE
  resource_group: eikon-backend
  interruptible: false
  timeout: 2h
  variables:
    # Fast artifact zipping on the (small) runner host.
    FF_USE_FASTZIP: "true"
    ARTIFACT_COMPRESSION_LEVEL: fast
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes: &backend_paths
        - asic/**/*
        - rtl/**/*
        - scripts/ci_eikon_backend.sh
        - scripts/ci_synth_gates.sh
        - .gitlab-ci.yml
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: *backend_paths
      when: manual
      allow_failure: true
  before_script:
    # No-op with the prebuilt EIKON_IMAGE; installs the tools on plain alpine.
    - command -v rsync >/dev/null 2>&1 || apk add --no-cache bash openssh-client rsync
  artifacts:
    when: always
    paths:
      - asic/reports/
    reports:
      dotenv: eikon.env   # EIKON_HOST: the host picked by the first job
    expire_in: 2 weeks

# Starts as soon as the ~15 s check jobs pass instead of after the sim stage
# (the checks keep a broken commit from occupying a lab host and licenses for
# ~18 min); resource_group still serializes it with other pipelines' backend jobs.
asic_synth:
  extends: .asic_backend
  stage: backend
  needs: [check_conventions, check_python_format, check_gitkeep, check_docs]
  script:
    - bash scripts/ci_eikon_backend.sh 01
    # Area / setup-timing gates on the synthesis reports; ASIC_GATES=fail (CI/CD
    # variable) makes them stop the pipeline before placement and routing.
    - bash scripts/ci_synth_gates.sh

asic_floorplan:
  extends: .asic_backend
  stage: backend
  needs: [asic_synth]
  rules: &backend_follow_rules
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: *backend_paths
  script:
    - bash scripts/ci_eikon_backend.sh 02

asic_pnr:
  extends: .asic_backend
  stage: backend
  needs: [asic_floorplan]
  rules: *backend_follow_rules
  script:
    - bash scripts/ci_eikon_backend.sh 03

asic_signoff:
  extends: .asic_backend
  stage: backend
  needs: [asic_pnr]
  rules: *backend_follow_rules
  script:
    - bash scripts/ci_eikon_backend.sh 04 05 check

asic_cleanup:
  extends: .asic_backend
  stage: backend
  needs: [asic_signoff]
  rules: *backend_follow_rules
  timeout: 5m
  artifacts: {}
  script:
    - bash scripts/ci_eikon_backend.sh cleanup
